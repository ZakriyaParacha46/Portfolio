name = "zakriya-chat"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGIN = "https://zakriyaparacha.com"
GEMINI_MODEL = "gemini-2.0-flash"

# GEMINI_API_KEY is a secret, not a var — set it with:
#   npx wrangler secret put GEMINI_API_KEY
# It must never be committed to this file or anywhere in the repo.
